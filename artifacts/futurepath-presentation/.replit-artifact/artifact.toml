kind = "slides"
previewPath = "/futurepath-presentation/"
title = "FuturePath — Introduction & Website Guide"
description = "A nine-slide presentation introducing FuturePath, the workforce problem, its target users and the website's career-planning journey."
version = "1.0.0"
id = "artifacts/futurepath-presentation"
router = "path"

[[services]]
name = "web"
paths = [ "/futurepath-presentation/" ]
localPort = 25610

[services.development]
run = "pnpm --filter @workspace/futurepath-presentation run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/futurepath-presentation", "run", "build" ]
serve = "static"
publicDir = "artifacts/futurepath-presentation/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25610"
BASE_PATH = "/futurepath-presentation/"
